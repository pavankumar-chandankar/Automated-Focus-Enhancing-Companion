[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focusbuddy"
version = "0.3.0"
description = "Consent-based focus assistant prototype with an optional LLM"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2.5,<3", "httpx>=0.26,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
focusbuddy = "focusbuddy.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 105
exclude = ["legacy", "frontend"]

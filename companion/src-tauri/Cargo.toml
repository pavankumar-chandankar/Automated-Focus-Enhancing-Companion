[package]
name = "oplyra-desktop"
version = "0.1.0"
description = "Local-first desktop focus companion"
authors = ["Oplyra contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "oplyra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local-only inference transport; no TLS/cloud client or proxy support required.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

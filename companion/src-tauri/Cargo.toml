[package]
name = "oplyra-desktop"
version = "0.1.0"
description = "Local-first desktop focus companion"
authors = ["Oplyra contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "oplyra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native inference transport: fixed loopback or explicitly selected HTTPS endpoint.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc"] }

tauri-nspanel = "=2.1.1"
